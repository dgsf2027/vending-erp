# 2026-09-23 在 A 机用户已登录的 Chrome 中核实。
# 独立 LaunchAgent 每天 07:00 经 run_daily.py 下载昨日销售并导入 vend。

browser:
  mode: cdp
  cdp_url: "http://127.0.0.1:9222"
  base_url: "https://fanmaiji.top"
  start_url: "/runspace_pc/salesManager/deliveryList"
  initial_response_path: "/delivery-log/page"
  session_success_selectors:
    - 'input.el-range-input[placeholder="开始日期"]'

login:
  verified: false                 # 尚未完成真实登录验证；禁止自动执行。
  url_path: "/login"
  # 以下字段来自已查看的登录页；后台 JS 负责 RSA 密码处理。
  user_selectors:
    - "#managername"
  pass_selectors:
    - "#managerpassword"
  submit_selectors:
    - "div[onclick='handleLogin()']"
  error_selectors:
    - ".ant-message-error"
    - ".el-message--error"
    - "[role='alert']"
  captcha_selectors:
    - "input[name*='captcha' i]"
    - "input[placeholder*='验证码']"
    - ".captcha"
  # 必须在联真后填写登录成功的唯一标记，缺失时拒绝执行。
  success_selectors: []

exports:
  sales:            # 销售管理 → 出货明细(查询限当月+上月,导出支持一年)
    verified: true
    async_export: true
    expected_function: "出货明细"
    validate_sales_report: true
    url_path: "/runspace_pc/salesManager/deliveryList"
    menu_selectors:
      - 'a[href="/runspace_pc/salesManager/deliveryList"]'
    export_button_selectors:
      - "button:has-text('导出'):visible"
    export_confirm_text: "确定要导出数据?"
    export_confirm_selectors:
      - ".el-message-box:visible button:has-text('确定')"
    date_range_param: day           # 默认按昨天；--month 可做补录
    date_filters:
      verified: true
      response_path: "/delivery-log/page"
      start_selectors:
        - 'input.el-range-input[placeholder="开始日期"]'
      end_selectors:
        - 'input.el-range-input[placeholder="结束日期"]'
      apply_selectors:
        - "button:has-text('查询'):visible"
    date_format: "%Y-%m-%d %H:%M:%S"
  replenish:        # 数据管理 → 系统补货记录(货道级,负数=取出调整)
    verified: false
    menu_selectors:
      - "text=系统补货记录"
    export_button_selectors:
      - "button:has-text('导出')"
      - "text=导出"
    date_range_param: day
    date_filters:
      verified: false
      start_selectors: []
      end_selectors: []
      apply_selectors: []
    date_format: "%Y-%m-%d %H:%M:%S"
  products:         # 商品管理 → 商品列表(98 个,含条码,别名初始化用)
    verified: false
    menu_selectors:
      - "text=商品管理"
    export_button_selectors:
      - "button:has-text('导出')"
      - "text=导出"
    date_range_param: none
