# 前端容器内 nginx:SPA history 模式 + /api 反代到后端容器
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 后端重建会换 IP；按请求解析并短期缓存，避免一直连接旧容器地址。
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    # 带 hash 的静态资源:文件名变了才会变,可长缓存(部署后自动拿新文件)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 前端路由 history 模式:找不到文件回落 index.html
    # index.html 绝不缓存,否则部署后浏览器还引用旧 hash 的 JS(用户卡旧版)
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # /api 反代到后端容器(compose 内部服务名 vend-server:8081)
    location /api/ {
        set $api_backend http://vend-server:8081;
        # 不附加 URI，保留原始 /api/ 路径与查询参数。
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;   # 导入 Excel 上传
    }
}
